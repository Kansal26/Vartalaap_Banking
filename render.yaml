services:
  - type: web
    name: vartalaap-banking-blue
    env: docker
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vartalaap-db-blue
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: vartalaap-db-blue
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vartalaap-db-blue
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect

databases:
  - name: vartalaap-db-blue
    region: singapore
    plan: free
